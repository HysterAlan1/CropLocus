};
var NM={rain:"Rainfall",dry:"Dry months",tmax:"Air temp. (max)",ph:"Soil pH",oc:"Organic carbon",slope:"Slope"};
function fmt(n){return Math.round(n).toLocaleString("en")}
function fx(q,lo){return q=="rain"?(lo?"irrigation":"drainage"):q=="dry"?"irrigation":q=="ph"?(lo?"liming":""):q=="oc"?"add organic matter":q=="slope"?"terracing":""}
function gap(d,q){return(q=="ph"||q=="slope"||q=="dry"||q=="tmax"?d.toFixed(1):Math.round(d))+UN[q]}
var TL={tmax:"Tmax, hottest month",tmax_cool:"Tmax, Nov–Feb",tmax_wet:"Tmax, Jun–Oct"};
function nm(q,C){return q=="tmax"?TL[C.src]:NM[q]}
var UN={rain:" mm",dry:" mo",tmax:" °C",ph:"",oc:" g/kg",slope:" %"};
var CN=["Unsuitable","Marginal","Moderate","High"],CV=["--c0","--c1","--c2","--c3"];
var $=function(i){return document.getElementById(i)};
function trap(x,e){if(x<=e[0]||x>=e[3])return 0;if(x<e[1])return(x-e[0])/(e[1]-e[0]);if(x<=e[2])return 1;return(e[3]-x)/(e[3]-e[2])}
function score(v,C){var a={rain:v.rain,dry:v.dry,tmax:v[C.src],ph:v.ph,oc:v.oc,slope:v.slope},sc={},wl=0,mn=2,lim=null;
 for(var k in W){sc[k]=trap(a[k],C[k]);wl+=W[k]*sc[k];if(sc[k]<mn||(sc[k]==mn&&W[k]>W[lim])){mn=sc[k];lim=k}}
 var adjusted=wl*Math.sqrt(Math.max(0,mn));
 var lims=Object.keys(W).filter(function(k){return sc[k]<.75}).sort(function(x,y){return sc[x]-sc[y]||W[y]-W[x]});
 return{s:adjusted,raw:wl,weak:mn,sc:sc,lim:lim,lims:lims,a:a}}
function cls(s){return s>=.8?3:s>=.6?2:s>=.4?1:0}
var css=function(v){return getComputedStyle(document.documentElement).getPropertyValue(v).trim()};
var COL=[];
function theme(t){document.documentElement.setAttribute("data-theme",t);try{localStorage.setItem("az-theme",t)}catch(e){}
 COL=CV.map(css);if(window.feats)run()}
(function(){var t=null;try{t=localStorage.getItem("az-theme")}catch(e){}
 if(!t)t=window.matchMedia&&matchMedia("(prefers-color-scheme: dark)").matches?"dark":"light";document.documentElement.setAttribute("data-theme",t);COL=CV.map(css)})();
$("theme").onclick=function(){theme(document.documentElement.getAttribute("data-theme")=="dark"?"light":"dark")};
if(typeof L==="undefined"){$("map").innerHTML='<p style="padding:80px 20px" class="mute">The map library did not load. Reload the page.</p>';throw new Error("no leaflet")}
var map=L.map("map",{zoomSnap:.25,minZoom:5,preferCanvas:true,attributionControl:false,zoomControl:false});
L.control.zoom({position:"bottomright"}).addTo(map);L.control.scale({position:"bottomright",imperial:false}).addTo(map);
var feats=LGA.features,selF=null,stF="";

 var q=f.properties.v;f.v={rain:q[0],dry:q[1],tmax:q[2],ph:q[3],oc:q[4],slope:q[5],tmax_cool:q[6],tmax_wet:q[7]};f.ly=ly;
 ly.on({click:function(){select(f,false)},mouseover:function(e){ly.bindTooltip(f.properties.l+", "+f.properties.s+": "+f.r.s.toFixed(2)+" "+CN[f.r.c],{sticky:true}).openTooltip(e.latlng)},mouseout:function(){ly.unbindTooltip()}})}}).addTo(map);
var stLayer=L.geoJSON(STATES,{interactive:false,style:{weight:1.4,fill:false,opacity:.6,color:"#000"}}).addTo(map);
map.createPane("hi").style.zIndex=450;map.getPane("hi").style.pointerEvents="none";
var hiR=L.svg({pane:"hi"}),hiL=L.layerGroup().addTo(map);
function highlight(){hiL.clearLayers();if(!selF)return;var o={interactive:false,renderer:hiR,fill:false,lineJoin:"round"};
 L.geoJSON(selF,{style:L.extend({color:css("--bg"),weight:7,opacity:.95},o)}).addTo(hiL);
 L.geoJSON(selF,{style:L.extend({},o,{fill:true,fillColor:"#fff",fillOpacity:.4,color:css("--ink"),weight:2.5,opacity:1})}).addTo(hiL)}
function fo(sh){return innerWidth<=760?{paddingTopLeft:[16,100],paddingBottomRight:[16,sh?Math.round(innerHeight*.4):16]}:{paddingTopLeft:[64,24],paddingBottomRight:[358,24]}}
function fitAll(){map.fitBounds(lgaLayer.getBounds(),fo(0))}
fitAll();window.addEventListener("resize",function(){map.invalidateSize()});
Object.keys(CROPS).forEach(function(k){$("crop").add(new Option(CROPS[k].n,k))});
var names=[].concat.apply([],[...new Set(feats.map(function(f){return f.properties.s}))]).sort();
$("state").add(new Option("All Nigeria",""));names.forEach(function(n){$("state").add(new Option(n,n))});
function run(){
 var C=CROPS[$("crop").value],bg=css("--bg"),ink=css("--ink");
 feats.forEach(function(f){f.r=score(f.v,C);f.r.c=cls(f.r.s);var on=!stF||f.properties.s==stF;
  f.ly.setStyle({fillColor:COL[f.r.c],fillOpacity:on?.88:.14,color:bg,weight:on?.6:.2})});

 stats();info()}
var RG=["< 0.40","0.40–0.60","0.60–0.80","≥ 0.80"];
function stats(){var C=CROPS[$("crop").value],c=[0,0,0,0],t=0;feats.forEach(function(f){if(stF&&f.properties.s!=stF)return;c[f.r.c]+=f.properties.a;t+=f.properties.a});
 $("stats").innerHTML='<div class="kt"><b>'+C.n+'</b><div class="mute sm">Suitability, % of area'+'</div></div>'+[3,2,1,0].map(function(i){return '<div class="k"><i style="background:'+COL[i]+'"></i><span>'+CN[i]+' <span class="mute">'+RG[i]+'</span></span><span>'+(t?Math.round(c[i]/t*100):0)+'%</span></div>'}).join("")}
function rng(e,k){return k=="oc"?"≥ "+e[1]:k=="slope"||k=="dry"?"≤ "+e[2]:k=="rain"?fmt(e[1])+"–"+fmt(e[2]):e[1]+"–"+e[2]}

function info(keep){
 var o=$("info").querySelector(".rk"),st=keep&&o?o.scrollTop:0;
 var C=CROPS[$("crop").value],h='<div class="det">';
 if(selF){var f=selF,r=f.r,k=r.lim;
  h+='<button class="x" aria-label="Close">×</button><h3>'+f.properties.l+'</h3><div class="mute sm">'+f.properties.s+', '+fmt(f.properties.a)+' km²</div><div class="sc"><span class="dot" style="background:'+COL[r.c]+'"></span><b>'+r.s.toFixed(2)+'</b>'+CN[r.c]+'</div><div class="mute sm">Adjusted index; raw weighted index '+r.raw.toFixed(2)+' · weakest factor '+nm(r.lim,C)+' ('+r.weak.toFixed(2)+')</div><table><thead><tr><th>Factor</th><th>Value</th><th>Optimum</th><th><span class="sr">Score</span></th></tr></thead>';
  for(var q in W){var v=r.a[q];v=q=="ph"||q=="slope"||q=="dry"||q=="tmax"?v.toFixed(1):fmt(v);h+='<tr'+(r.lims.indexOf(q)>-1?' class="lim"':'')+'><td>'+nm(q,C)+'</td><td>'+v+UN[q]+'</td><td>'+rng(C[q],q)+'</td><td class="b"><div><i style="width:'+r.sc[q]*100+'%;background:'+COL[cls(r.sc[q])]+'"></i></div></td></tr>'}
  h+='</table>';
  if(r.lims.length){h+='<p class="lm">'+'Constraints</p><ul class="lims">'+r.lims.map(function(q){var e=C[q],x=r.a[q],lo=x<e[1],g=gap(lo?e[1]-x:x-e[2],q)+(lo?" below":" above")+" range",m=fx(q,lo);return'<li><b>'+nm(q,C)+'</b> '+g+(m?'; '+m:'')+'</li>'}).join("")+'</ul>'}
  }
 else{var A=feats.filter(function(f){return !stF||f.properties.s==stF}),cn={},tt=0;for(var q in W)cn[q]=0;
  A.forEach(function(f){tt+=f.r.s;for(var q in W)if(f.r.sc[q]<.5)cn[q]++});
  var ks=Object.keys(W).filter(function(q){return cn[q]}).sort(function(x,y){return cn[y]-cn[x]||W[y]-W[x]});
  h+='<h3>'+(stF||"Nigeria")+'</h3><div class="mute sm">'+A.length+' LGAs, mean adjusted score '+(tt/A.length).toFixed(2)+'</div>'+(ks.length?'<table><thead><tr><th>Factor scoring below 0.5</th><th>LGAs</th></tr></thead>'+ks.map(function(q){return'<tr><td>'+nm(q,C)+'</td><td>'+cn[q]+'</td></tr>'}).join("")+'</table>':'')}
 var a=feats.filter(function(f){return !stF||f.properties.s==stF}).sort(function(x,y){return y.r.s-x.r.s}),n=Math.min(5,Math.floor(a.length/2));
 h+='</div>';
 if(n)h+='<div class="rk"><section class="rp hi" aria-label="Highest scoring LGAs"><h4>Highest scoring</h4><ol>'+a.slice(0,n).map(li).join("")+'</ol></section><section class="rp lo" aria-label="Lowest scoring LGAs"><h4>Lowest scoring</h4><ol>'+a.slice(a.length-n).reverse().map(li).join("")+'</ol></section></div>';
 $("info").innerHTML=h;$("info").classList.toggle("ov",!selF&&!stF);
 if(st){var r=$("info").querySelector(".rk");if(r)r.scrollTop=st}}
$("info").addEventListener("click",function(e){if(e.target.closest(".x")){selF=null;highlight();info();return}var l=e.target.closest("li");if(l)select(feats[+l.dataset.i],true)});
$("info").addEventListener("keydown",function(e){var l=e.target.closest&&e.target.closest("li[data-i]");if(l&&(e.key=="Enter"||e.key==" ")){e.preventDefault();select(feats[+l.dataset.i],true)}});
function select(f,zoom){selF=f;highlight();if(zoom)map.fitBounds(f.ly.getBounds(),L.extend({maxZoom:9},fo(1)));info(true)}
function area(n,keep){stF=n;selF=null;if(!keep)q.value="";closeRes();if(n){var b=L.latLngBounds([]);feats.forEach(function(f){if(f.properties.s==n)b.extend(f.ly.getBounds())});map.fitBounds(b,fo(1))}else fitAll();run()}
$("crop").onchange=run;$("state").onchange=function(){area(this.value)};
var q=$("q"),res=$("res"),hits=[],act=-1;
function norm(s){return String(s).normalize("NFD").replace(/[\u0300-\u036f]/g,"").toLowerCase().replace(/[’'`´]/g,"").replace(/[^a-z0-9]+/g," ").trim()}
var ALIAS={"FCT Abuja":" federal capital territory abuja fct"};
feats.forEach(function(f){var p=f.properties;p.n=norm(p.l);p.sn=norm(p.s)});
var SN=names.map(function(n){return{n:n,k:norm(n+(ALIAS[n]||""))}});
function rank(n,hay,t){var tk=t.split(" "),c=t.replace(/ /g,"");
 if(n==t)return 0;if(n.indexOf(t)==0)return 1;
 if((" "+n).indexOf(" "+t)>-1)return 2;
 if(n.replace(/ /g,"").indexOf(c)==0)return 3;
 if(tk.every(function(w){return(" "+hay).indexOf(" "+w)>-1}))return 4;
 if(tk.every(function(w){return hay.indexOf(w)>-1}))return 5;
 return -1}
function search(raw){var t=norm(raw);if(!t)return{m:[],more:0};var m=[];
 SN.forEach(function(s){var r=rank(norm(s.n),s.k,t);if(r>-1)m.push({r:r-.5,s:s.n,k:"s"})});
 feats.forEach(function(f,i){var p=f.properties,r=rank(p.n,p.n+" "+p.sn,t);if(r>-1)m.push({r:r,i:i,k:"l"})});
 m.sort(function(a,b){return a.r-b.r||(a.k=="s"?-1:b.k=="s"?1:feats[a.i].properties.l.localeCompare(feats[b.i].properties.l))});
 return{m:m.slice(0,10),more:Math.max(0,m.length-10)}}
function el(tag,cls,txt){var e=document.createElement(tag);if(cls)e.className=cls;if(txt!=null)e.textContent=txt;return e}
function closeRes(){res.style.display="none";act=-1;q.setAttribute("aria-expanded","false");q.removeAttribute("aria-activedescendant")}
function setAct(n){var b=res.querySelectorAll("button");if(!b.length)return;
 act=(n+b.length)%b.length;b.forEach(function(x,j){x.classList.toggle("on",j==act);x.setAttribute("aria-selected",j==act)});
 b[act].scrollIntoView({block:"nearest"});q.setAttribute("aria-activedescendant",b[act].id)}
function showRes(){var o=search(q.value);hits=o.m;res.textContent="";act=-1;
 if(!norm(q.value)){closeRes();return}
 if(!hits.length)res.appendChild(el("div","none","No match"));
 hits.forEach(function(h,j){var b=el("button");b.type="button";b.id="r"+j;b.setAttribute("role","option");b.dataset.j=j;
  if(h.k=="s"){b.appendChild(el("span",null,h.s));b.appendChild(el("span","mute","State"))}
  else{var p=feats[h.i].properties;b.appendChild(el("span",null,p.l));b.appendChild(el("span","mute",p.s))}
  res.appendChild(b)});
 if(o.more)res.appendChild(el("div","none","+"+o.more+" more"));
 res.style.display="block";q.setAttribute("aria-expanded","true")}
function pick(j){var h=hits[j];if(!h)return;closeRes();
 if(h.k=="s"){q.value=h.s;$("state").value=h.s;area(h.s,true)}
 else{var f=feats[h.i];q.value=f.properties.l;
  if(stF&&stF!=f.properties.s){stF=f.properties.s;$("state").value=stF;selF=null;run()}
  select(f,true)}
 q.blur()}
q.oninput=showRes;
q.onfocus=function(){if(norm(q.value))showRes()};
q.onkeydown=function(e){var open=res.style.display=="block";
 if(e.key=="ArrowDown"){e.preventDefault();if(!open)showRes();else setAct(act+1)}
 else if(e.key=="ArrowUp"){e.preventDefault();if(open)setAct(act<0?-1:act-1)}
 else if(e.key=="Enter"){if(open&&hits.length){e.preventDefault();pick(act<0?0:act)}}
 else if(e.key=="Escape"){if(open)closeRes();else q.value=""}};
res.onmousedown=function(e){e.preventDefault()};
res.onclick=function(e){var b=e.target.closest("button");if(b)pick(+b.dataset.j)};
document.addEventListener("click",function(e){if(!e.target.closest(".search"))closeRes()});
window.feats=feats;run();
</script></body></html>
